[versions]
agp = "9.4.0"
kotlin = "2.4.10"
composePlugin = "1.12.0"

compileSdk = "36"
minSdk = "26"
targetSdk = "36"

carApp = "1.7.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
ktor = "3.5.2"
room = "2.8.4"
androidxSqlite = "2.6.1"
ksp = "2.3.11"
koin = "4.1.1"
navigation3 = "1.1.6"

activityCompose = "1.12.4"
composeBom = "2026.06.01"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
playServicesLocation = "21.4.0"
playServicesMaps = "20.0.0"
mapsCompose = "6.6.0"

chargeaheadApi = "0.4.0"

[libraries]
# --- shared (Kotlin Multiplatform) ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# Only for ViewModel tests: viewModelScope runs on the Main dispatcher, which
# a plain JVM test JVM does not have. Dispatchers.setMain supplies one.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# ViewModel, multiplatform: AndroidX publishes this artifact for iOS and JVM
# too, so the shared ViewModels compile for every target (plans/technical-debts).
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }

# The backend's wire contract. Served from the backend itself, see
# settings.gradle.kts.
chargeahead-api-model = { module = "org.julakali.chargeahead:api-model", version.ref = "chargeaheadApi" }

# --- HTTP (ab M1: OpenChargeMap) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Engines: je Ziel eine, weil Ktor keine gemeinsame hat.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# --- Persistence (M3 tile cache; Room KMP since the technical-debt round) ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Bundled instead of platform SQLite: the same SQLite version on every target.
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }

# --- DI (Koin, plain DSL — technical-debts: no annotations) ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
# ViewModel DSL (viewModelOf) usable from commonMain — Koin 4's multiplatform ViewModel API.
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# --- Navigation (phone app only — the car has the Car App Library's own stack) ---
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# --- Android Auto ---
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "carApp" }

# --- Android phone UI ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
# Google's full Material icon set (EvStation etc.) — R8 strips the unused rest.
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# --- Map (decision 2026-09-07: Google Maps Compose; key from local.properties) ---
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }

play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
